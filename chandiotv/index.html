<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chandio TV — Live TV Channels</title>
<meta name="description" content="Chandio TV — watch live TV channels from Pakistan, India and around the world. Official streams only.">
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#101013;color:#f5f5f5;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.view{display:none}
.view.on{display:block;animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
#view-tv{max-width:1200px;margin:0 auto;padding:10px 10px 34px}
.chcard{background:#fdfdfd;border:1px solid #d8d8d8;border-radius:12px;overflow:hidden;text-align:start;cursor:pointer;color:#141414;padding:0;display:flex;flex-direction:column;width:100%}
.chcard:focus-visible{outline:2px solid #43a047;outline-offset:2px}
.clogo{position:relative;height:86px;background:#fff;display:grid;place-items:center;overflow:hidden}
.clogo img{max-height:74px;max-width:86%;object-fit:contain}
.clogo.dark{background:linear-gradient(135deg,#1d2b4d,#0d1730)}
.clogo .mono{color:#cfe3ff;font-weight:800;font-size:22px;letter-spacing:.5px;text-align:center;padding:0 8px}
.free-badge{position:absolute;top:4px;inset-inline-start:4px;background:#2196F3;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;z-index:2;letter-spacing:.4px}
.spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:pspin .8s linear infinite;margin:0 auto 12px}
@keyframes pspin{to{transform:rotate(360deg)}}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.3}}
.md-search-wrap{display:flex;gap:10px;align-items:stretch;margin:14px 0 8px}
.md-search-field{flex:1;display:flex;align-items:center;gap:10px;background:#1e1e23;border:1px solid #3a3a41;border-radius:999px;padding:0 16px;min-height:48px}
.md-search-field svg{flex:none;color:#9e9ea7}
.md-search-field input{flex:1;border:0;background:transparent;color:#f5f5f5;font-size:16px;outline:0;min-width:0;height:100%}
.md-search-field input::placeholder{color:#9e9ea7}
.md-filter-btn{width:48px;height:48px;border-radius:50%;border:1px solid #3a3a41;background:#1e1e23;color:#f5f5f5;display:grid;place-items:center;cursor:pointer;flex:none}
.empty{background:#1b1b20;border:1px dashed #3a3a41;border-radius:12px;padding:26px;text-align:center;color:#9e9ea7}
.filters{display:none}
.grid{display:grid;gap:12px}
.foot-note{text-align:center;color:#6d6d75;font-size:12px;padding:18px 8px 4px}
</style>
<style id="lnt-theme">#view-tv #tvFilters, #view-tv #tvCrumb, #view-tv .md-filter-btn{display:none!important}
#view-tv .ds-sec-h{background:linear-gradient(120deg,#7f0000,#c62828 45%,#8e0e00);border-radius:10px;padding:10px 14px}
#view-tv .ds-sec-title{color:#fff!important}
#view-tv #tvFolderBody{background:#101013;border-radius:12px;padding:10px}
#view-tv .md-search-field{background:#1e1e23!important;border:1px solid #3a3a41!important;border-radius:10px}
#view-tv .md-search-field input{color:#f5f5f5!important}
#view-tv .md-search-field input::placeholder{color:#9e9ea7!important}
#view-tv #tvGrid.lnt-host{display:block!important;grid-template-columns:none!important}
#view-tv .lnt-gridwrap{width:100%}
.lnt-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.lnt-tabs::-webkit-scrollbar{display:none}
.lnt-tab{flex:0 0 auto;background:#26262c;color:#f1f1f1;border:1px solid #3d3d45;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;letter-spacing:.4px;cursor:pointer;text-transform:uppercase}
.lnt-tab.on{background:#43a047;border-color:#43a047;color:#fff}
.lnt-tab .heart{color:#ff5252;margin-inline-end:5px}
.lnt-tab.on .heart{color:#fff}
.lnt-cc{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px;background:#1b1b20;color:#fff;padding:8px 12px;font-weight:800;font-size:14px;letter-spacing:.5px;border-inline-start:4px solid #d32f2f;border-radius:6px}
.lnt-cc .lnt-n{color:#9e9ea7;font-size:12px;font-weight:600}
#view-tv .lnt-gridwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:900px){#view-tv .lnt-gridwrap{grid-template-columns:repeat(5,1fr)}}
#view-tv .chcard.lnt-card{background:#fdfdfd;border:1.5px solid #d32f2f;border-radius:12px;color:#141414;overflow:hidden}
#view-tv .lnt-card .clogo{height:84px;background:#fff;position:relative}
#view-tv .lnt-card .clogo.dark{background:linear-gradient(135deg,#eceff1,#cfd8dc)}
#view-tv .lnt-card .clogo .mono{color:#546e7a}
#view-tv .lnt-card .cbody-min{padding:7px 5px 9px;text-align:center;display:block}
#view-tv .lnt-card .cbody-min h3{font-family:Georgia,'Times New Roman',serif;font-size:13.5px;font-weight:700;color:#161616;text-align:center;margin:0;line-height:1.25}
#view-tv .lnt-card .curdu{display:block;font-size:11px;color:#777;margin-top:2px}
#view-tv .lnt-card .favbtn{position:absolute;top:4px;inset-inline-end:4px;z-index:3;background:rgba(255,255,255,.88);border:none;border-radius:50%;width:26px;height:26px;font-size:15px;line-height:1;color:#b0bec5;cursor:pointer;padding:0}
#view-tv .lnt-card .favbtn.on{color:#e53935}
#view-tv .lnt-card .free-badge{font-size:8.5px;padding:1px 5px}

.ltv-stage{position:sticky;top:8px;z-index:40;background:#000;border:1.5px solid #d32f2f;border-radius:12px;overflow:hidden;margin:10px 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.ltv-screen{position:relative;aspect-ratio:16/9;max-height:58vh;background:#000}
.ltv-media{position:absolute;inset:0}
.ltv-media video,.ltv-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.ltv-docknote{position:absolute;inset:0;display:grid;place-items:center;color:#bbb;background:#141417;font-size:13px;text-align:center;padding:14px}
.ltv-docknote[hidden]{display:none}
.ltv-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.74);color:#fff;text-align:center;padding:16px;z-index:5;font-size:14px}
.ltv-overlay[hidden]{display:none}
.ltv-overlay .spin{margin:0 auto 12px}
.ltv-overlay .ltv-ov-btns{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ltv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:#16161a;padding:8px 10px}
.ltv-meta{color:#fff;display:flex;gap:8px;align-items:center;min-width:0;flex:1}
.ltv-meta b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltv-sub{color:#9e9ea7;font-size:11.5px;white-space:nowrap}
.ltv-live{background:#d32f2f;color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.4px}
.ltv-btns{display:flex;gap:6px;flex-wrap:wrap}
.ltv-btn{background:#26262c;color:#f1f1f1;border:1px solid #3d3d45;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.ltv-btn.stop{color:#ff8a80}
.ltv-btn[disabled]{opacity:.45;cursor:default}
.ltv-btn.on{background:#43a047;border-color:#43a047;color:#fff}
.ltv-servers{display:inline-flex;gap:6px;flex-wrap:wrap}
.ltv-qsel{background:#26262c;color:#f1f1f1;border:1px solid #3d3d45;border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
.ltv-mini{position:fixed;right:10px;bottom:76px;z-index:900;width:198px;background:#101013;border:1.5px solid #d32f2f;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.65);display:flex;flex-direction:column}
.ltv-mini[hidden]{display:none}
.ltv-mini-slot{position:relative;aspect-ratio:16/9;background:#000}
.ltv-mini-slot video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.ltv-mini.infoonly .ltv-mini-slot{display:none}
.ltv-mini-info{padding:6px 9px 2px;color:#fff;display:flex;flex-direction:column;min-width:0}
.ltv-mini-info b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltv-mini-info span{font-size:10.5px;color:#9e9ea7}
.ltv-mini-btns{display:flex;gap:6px;padding:6px 8px 8px}
.ltv-mini-btns .ltv-btn{flex:1;padding:6px 4px;font-size:11.5px}
#view-tv .lnt-card.playing{outline:3px solid #43a047;outline-offset:1px}
#view-tv .lnt-card.playing .clogo::after{content:'▶ NOW PLAYING';position:absolute;left:4px;bottom:4px;background:#43a047;color:#fff;font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:99px;z-index:3}

#view-tv .ds-sec-h, #view-tv #tvFolderToggle, #view-tv .ptv-block{display:none!important}
.ltv-head{display:flex;align-items:center;gap:10px;padding:12px 12px;background:linear-gradient(120deg,rgba(0,0,0,.14),transparent 40%),repeating-linear-gradient(45deg,#a31515 0 14px,#b71c1c 14px 28px,#8e0e00 28px 42px);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35);margin:0 0 4px}
.ltv-title{flex:1;min-width:0;color:#fff;display:flex;flex-direction:column}
.ltv-title b{font-size:19px;letter-spacing:.2px;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.ltv-title span{font-size:12px;opacity:.92}
.ltv-hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;width:38px;height:38px;font-size:17px;cursor:pointer;flex:0 0 auto}
.ltv-setpanel{display:flex;gap:8px;align-items:center;background:#1b1b20;color:#ddd;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:12.5px}
.ltv-setopt{background:#26262c;color:#f1f1f1;border:1px solid #3d3d45;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.ltv-setopt.on{background:#43a047;border-color:#43a047;color:#fff}
.ltv-countries{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.ltv-countries::-webkit-scrollbar{display:none}
.ltv-cc-chip{flex:0 0 auto;background:#3a0d0d;color:#ffd9d9;border:1px solid #7f1d1d;border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.ltv-cc-chip.on{background:#43a047;border-color:#43a047;color:#fff}
#view-tv.ltv-compact .lnt-gridwrap{grid-template-columns:repeat(4,1fr)}
@media(min-width:900px){#view-tv.ltv-compact .lnt-gridwrap{grid-template-columns:repeat(6,1fr)}}

.ltv-stage.pipmode .ltv-screen{display:none}
</style>
</head>
<body>
<div class="view on" id="view-tv">
  <div class="ltv-head">
    <button type="button" class="ltv-hbtn" id="ltvMenuBtn" aria-label="Menu">☰</button>
    <div class="ltv-title"><b lang="en">Chandio TV</b><span lang="en">Live TV — All Channels</span></div>
    <button type="button" class="ltv-hbtn" id="ltvSearchBtn" aria-label="Search channels">🔍</button>
    <button type="button" class="ltv-hbtn" id="ltvSetBtn" aria-label="TV display settings">⚙</button>
  </div>
  <div class="ltv-setpanel" id="ltvSetPanel" hidden>
    <span lang="en">Grid size:</span>
    <button type="button" class="ltv-setopt" data-density="cozy">Comfortable</button>
    <button type="button" class="ltv-setopt" data-density="compact">Compact</button>
  </div>
  <div id="tvFolderBody">
    <div id="ltvStage" class="ltv-stage" hidden>
      <div class="ltv-screen" id="ltvScreen">
        <div id="ltvMediaSlot" class="ltv-media"></div>

        <div id="ltvOverlay" class="ltv-overlay" hidden></div>
      </div>
      <div class="ltv-bar">
        <div class="ltv-meta">
          <span class="ltv-live" id="ltvLive" style="display:none"><span class="live-dot"></span>LIVE</span>
          <b id="ltvName" lang="en"></b>
          <span id="ltvSub" class="ltv-sub" lang="en"></span>
        </div>
        <div class="ltv-btns">
          <span id="ltvServers" class="ltv-servers"></span>
          <select id="ltvQuality" class="ltv-qsel" aria-label="Stream quality" hidden><option value="-1">Auto</option></select>
          <button type="button" id="ltvPipBtn" class="ltv-btn">⧉ Picture-in-Picture</button>
          <button type="button" id="ltvPageBtn" class="ltv-btn">Player Page</button>
          <button type="button" id="ltvStopBtn" class="ltv-btn stop">✕ Stop</button>
        </div>
      </div>
    </div>
    <div class="md-search-wrap">
      <div class="md-search-field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="tvSearchUni" placeholder="Search TV Channels, Country, Category..." aria-label="Search TV Channels, Country, Category">
      </div>
      <button type="button" class="md-filter-btn" id="tvFilterToggle" aria-label="Filters" aria-expanded="true" aria-controls="tvFilters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
    </div>
    <div class="filters" id="tvFilters"></div>
    <div class="filters" id="tvCrumb"></div>
    <div class="grid fgrid" id="tvFolders" style="display:none"></div>
    <div class="grid g-chans" id="tvGrid"></div>
    <div lang="en" class="empty" id="tvEmpty" style="display:none">No channels match these filters.</div>
  </div>
  <div class="foot-note" lang="en">Chandio TV — official live streams only</div>
</div>
<div id="ltvMini" class="ltv-mini" hidden>
  <div id="ltvMiniSlot" class="ltv-mini-slot"></div>
  <div class="ltv-mini-info"><b id="ltvMiniName" lang="en"></b><span id="ltvMiniState" lang="en">Live TV</span></div>
  <div class="ltv-mini-btns">
    <button type="button" id="ltvMiniOpen" class="ltv-btn">TV Page</button>
    <button type="button" id="ltvMiniClose" class="ltv-btn stop">✕ Close</button>
  </div>
</div>

<script>
/* ===== LNT TV experience: persistent in-page player, floating mini player, real PiP ===== */
var LTV = { id: null, mode: null, src: null, hls: null, video: null, frame: null,

            q: -1, levels: null };
function ltvEl(id){ return document.getElementById(id); }
function ltvSetSub(txt){ var el = ltvEl('ltvSub'); if(el) el.textContent = txt || ''; }
function ltvShowOverlay(html){ var o = ltvEl('ltvOverlay'); if(o){ o.innerHTML = html; o.hidden = false; } }
function ltvHideOverlay(){ var o = ltvEl('ltvOverlay'); if(o){ o.hidden = true; o.innerHTML = ''; } }
function ltvSpinner(msg){ ltvShowOverlay('<div><div class="spin" aria-hidden="true"></div><div lang="en">' + esc(msg) + '</div></div>'); }
function ltvArmWatchdog(){ ltvClearWatchdog(); LTV.watchdog = setTimeout(function(){ ltvFail(); }, 15000); }
function ltvClearWatchdog(){ if(LTV.watchdog){ clearTimeout(LTV.watchdog); LTV.watchdog = null; } }
var ltvWakeLock = null;
function ltvKeepScreenOn(){ try{ if('wakeLock' in navigator && !ltvWakeLock){ navigator.wakeLock.request('screen').then(function(lock){ ltvWakeLock = lock; lock.addEventListener('release', function(){ ltvWakeLock = null; }); }).catch(function(){}); } }catch(e){} }

document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && LTV.video && !LTV.video.paused) ltvKeepScreenOn(); });

  if(LTV.video) return LTV.video;

  v.preload = 'auto'; v.style.width = '100%'; v.style.height = '100%';

  v.addEventListener('playing', ltvOnData);
  v.addEventListener('playing', ltvKeepScreenOn);

}
function ltvDestroyHls(){ if(LTV.hls){ try{ LTV.hls.destroy(); }catch(e){} LTV.hls = null; } }

function ltvOnData(){

  var lp = ltvEl('ltvLive'); if(lp) lp.style.display = '';
  var ms = ltvEl('ltvMiniState'); if(ms) ms.textContent = '🔴 LIVE — playing in mini player';
  ltvSetSub('Playing live inside this website');
}
function ltvFail(){
  if(LTV.settled || !LTV.id) return;
  LTV.attempts++;
  if(LTV.attempts <= 2){
    ltvSpinner('Reconnecting… (attempt ' + LTV.attempts + ' of 2)');
    ltvClearWatchdog();
    setTimeout(function(){ if(!LTV.settled && LTV.id && LTV.src) ltvStartNative(LTV.src.url, LTV.src.type === 'hls', true); }, 1200 * LTV.attempts);
  } else {
    LTV.settled = true; ltvClearWatchdog(); ltvDestroyHls();
    // In-site playback lock (2026-11-01): the failure overlay no longer
    // offers an "Official Site ↗" escape; Retry + Player Page stay in-site.
    ltvShowOverlay('<div><div lang="en">This channel could not play here.</div>'
      + '<div class="ltv-ov-btns">'
      + '<button type="button" class="ltv-btn" id="ltvRetryBtn">↻ Retry</button>'
      + '<button type="button" class="ltv-btn" id="ltvPageBtn2">Player Page</button>'
      + '</div></div>');
    var rb = ltvEl('ltvRetryBtn'); if(rb) rb.addEventListener('click', function(){ ltvPlay(LTV.id); });
    var pb = ltvEl('ltvPageBtn2'); if(pb) pb.addEventListener('click', function(){ location.hash = '#watch/' + LTV.id; });
  }
}
function ltvStartNative(src, isHls, isRetry){
  LTV.mode = 'native'; LTV.src = { type: isHls ? 'hls' : 'stream', url: src };
  if(!isRetry){ LTV.attempts = 0; }
  LTV.settled = false;
  ltvClearFrame();
  ltvUndock();
  var v = ltvVideo();
  var slot = ltvEl('ltvMediaSlot');
  if(v.parentNode !== slot) slot.appendChild(v);
  v.style.display = '';
  var lp = ltvEl('ltvLive'); if(lp) lp.style.display = 'none';
  ltvResetQuality();
  ltvSpinner('Connecting…');
  ltvSetSub('Connecting…');
  ltvDestroyHls();
  ltvClearWatchdog(); ltvArmWatchdog();
  if(isHls && window.Hls && Hls.isSupported()){
    LTV.hls = new Hls({ enableWorker: true, startLevel: 0, lowLatencyMode: false, maxBufferLength: 18, maxMaxBufferLength: 30, backBufferLength: 10 }); /* Ultra-aligned player settings + Auto starts at lowest quality (startLevel: 0), owner orders 2026-11-17 */
    LTV.hls.loadSource(src);
    LTV.hls.attachMedia(v);

  if(pr && pr.catch) pr.catch(function(){
    if(LTV.settled) return;
    ltvShowOverlay('<div><div lang="en">Tap play to start this channel.</div><div class="ltv-ov-btns"><button type="button" class="ltv-btn" id="ltvTapPlay">▶ Play</button></div></div>');
    var tp = ltvEl('ltvTapPlay');

  });

}
function ltvStartFrame(src){
  LTV.mode = 'frame'; LTV.src = { type: 'frame', url: src };
  LTV.settled = true; LTV.attempts = 0;
  ltvDestroyHls(); ltvClearWatchdog();
  if(LTV.video){ try{ LTV.video.pause(); }catch(e){} LTV.video.style.display = 'none'; }
  ltvUndock();
  var slot = ltvEl('ltvMediaSlot');
  ltvClearFrame();
  var f = document.createElement('iframe');
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('title', 'Official embedded player');
  var url = src;
  if(/youtube\.com\/embed\//.test(url)) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'autoplay=1&playsinline=1&rel=0';
  f.src = url;
  slot.appendChild(f);
  LTV.frame = f;
  var lp = ltvEl('ltvLive'); if(lp) lp.style.display = 'none';
  ltvHideOverlay();
  ltvResetQuality();
  ltvSetSub('Official embedded player — playback runs on the provider player');
  ltvUpdatePipBtn();
}
function ltvMediaSession(ch){
  if(!('mediaSession' in navigator)) return;
  try{
    if(typeof MediaMetadata !== 'undefined') navigator.mediaSession.metadata = new MediaMetadata({ title: ch.en, artist: 'Chandio TV — Live TV', album: countryName(ch.cc) });
    navigator.mediaSession.setActionHandler('play', function(){ if(LTV.video) LTV.video.play(); });
    navigator.mediaSession.setActionHandler('pause', function(){ if(LTV.video) LTV.video.pause(); });
  }catch(e){}
}
/* ---- backup-copy grouping ("(Server 2)" records) for the in-player
   server switcher. Copies of one channel share the same base name (the
   " (Server N)" suffix stripped) and the same country code; records whose
   primary source URL is identical are the same server and collapse to one. */
function ltvBaseName(en){ return String(en || '').replace(/\s*\(Server\s+\d+\)\s*$/i, '').trim().toLowerCase(); }
function ltvSrvNum(c){ var m = /\(Server\s+(\d+)\)\s*$/i.exec(c.en || ''); return m ? parseInt(m[1], 10) : 1; }
function ltvCopies(ch){
  var base = ltvBaseName(ch.en), out = [], seenUrl = {};
  var all = TV.concat(typeof TV_ALT !== 'undefined' ? TV_ALT : []);
  for(var i = 0; i < all.length; i++){
    var c = all[i];
    if(!c || c.cat === 'radio') continue;
    if(c.cc !== ch.cc) continue;
    if(ltvBaseName(c.en) !== base) continue;
    var srcs = getChannelSources(c);
    if(!srcs.length) continue;
    if(seenUrl[srcs[0].url]) continue;
    seenUrl[srcs[0].url] = 1;
    out.push(c);
  }
  out.sort(function(a, b){
    var na = ltvSrvNum(a), nb = ltvSrvNum(b);
    if(na !== nb) return na - nb;
    return a.id < b.id ? -1 : 1;
  });
  return out;
}
function ltvPaintServers(ch){
  var wrap = ltvEl('ltvServers'); if(!wrap) return;
  var copies = ltvCopies(ch);
  if(copies.length < 2){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = copies.map(function(c, i){
    return '<button type="button" class="ltv-btn' + (c.id === LTV.id ? ' on' : '') + '" data-lsrv="' + esc(c.id) + '">Server ' + (i + 1) + '</button>';
  }).join('');
  wrap.querySelectorAll('[data-lsrv]').forEach(function(b){
    b.addEventListener('click', function(){ ltvPlay(b.getAttribute('data-lsrv')); });
  });
}
/* ---- quality selector for the in-section player (hls.js levels, same
   labelling as the player page: Auto + height/bitrate options). ---- */
function ltvResetQuality(){
  LTV.levels = null;
  var sel = ltvEl('ltvQuality');
  if(sel){ sel.hidden = true; sel.innerHTML = '<option value="-1">Auto</option>'; sel.value = '-1'; }
}
function ltvBuildQuality(levels){
  var sel = ltvEl('ltvQuality'); if(!sel) return;
  LTV.levels = levels || null;
  if(!levels || levels.length < 2){ ltvResetQuality(); return; }
  var order = levels.map(function(_, i){ return i; }).sort(function(a, b){ return levels[a].bitrate - levels[b].bitrate; });
  sel.innerHTML = '<option value="-1">Auto</option>' + order.map(function(i){
    var lv = levels[i];
    var lbl = lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k';
    var dup = lv.height && levels.some(function(o, j){ return j !== i && o.height === lv.height; });
    if(dup) lbl += ' · ' + (Math.round(lv.bitrate / 100000) / 10) + 'M';
    return '<option value="' + i + '">' + lbl + '</option>';
  }).join('');
  sel.value = String(LTV.q);
  if(LTV.q !== -1 && LTV.hls){ try{ LTV.hls.currentLevel = LTV.q; }catch(e){} }
  sel.hidden = false;
}
function ltvPlay(id){
  var ch = findTv(id);
  if(!ch) return;
  if(typeof stopOthers === 'function'){ try{ stopOthers('tv'); }catch(e){} }
  var srcs = getChannelSources(ch);
  var hlsSrc = null, directSrc = null, frameSrc = null;
  srcs.forEach(function(s2){
    if(s2.type === 'hls' && !hlsSrc) hlsSrc = s2;
    else if(s2.type === 'stream' && !directSrc) directSrc = s2;
    else if((s2.type === 'youtube-embed' || s2.type === 'embed') && !frameSrc) frameSrc = s2;
  });
  if(!hlsSrc && !directSrc && !frameSrc){
    /* Chandio TV standalone: no separate watch page exists — show the stage
       with an honest message (plus the broadcaster's official site, if listed). */
    LTV.id = id;
    var st0 = ltvEl('ltvStage'); if(st0) st0.hidden = false;
    var nm0 = ltvEl('ltvName'); if(nm0) nm0.textContent = ch.en;
    var mn0 = ltvEl('ltvMiniName'); if(mn0) mn0.textContent = ch.en;
    ltvSetSub('No in-site player source for this channel');
    ltvShowOverlay('<div><div lang="en">This channel could not play here.</div>'
      + (ch.link ? '<div class="ltv-ov-btns"><a class="ltv-btn" href="' + esc(ch.link) + '" target="_blank" rel="noopener">Official Site \u2197</a></div>' : '')
      + '</div>');
    if(st0 && st0.scrollIntoView){ try{ st0.scrollIntoView({ behavior: 'smooth', block: 'start' }); }catch(e){} }
    return;
  }
  LTV.id = id;
  var stage = ltvEl('ltvStage');
  if(stage){ stage.hidden = false; }
  var nm = ltvEl('ltvName'); if(nm) nm.textContent = ch.en;
  var mn = ltvEl('ltvMiniName'); if(mn) mn.textContent = ch.en;
  var foot = ltvEl('tvFolderBody'); if(foot && foot.hidden){ foot.hidden = false; var tg = ltvEl('tvFolderToggle'); if(tg) tg.setAttribute('aria-expanded', 'true'); }
  document.querySelectorAll('.lnt-card.playing').forEach(function(c){ c.classList.remove('playing'); });
  var card = document.querySelector('.lnt-card[data-href="#watch/' + id + '"]');
  if(card) card.classList.add('playing');
  if(hlsSrc) ltvStartNative(hlsSrc.url, true);
  else if(directSrc) ltvStartNative(directSrc.url, false);
  else ltvStartFrame(frameSrc.url);
  ltvMediaSession(ch);
  if(typeof addRecent === 'function'){ try{ addRecent(ch); }catch(e){} }
  ltvPaintServers(ch);
  if(typeof renderTv === 'function'){ try{ renderTv(); }catch(e){} }
  if(stage && stage.scrollIntoView){ try{ stage.scrollIntoView({ behavior: 'smooth', block: 'start' }); }catch(e){} }
}
function ltvStopPlayer(){
  ltvClearWatchdog(); ltvDestroyHls(); ltvClearFrame();
  if(LTV.video){ try{ LTV.video.pause(); LTV.video.removeAttribute('src'); LTV.video.load(); }catch(e){} LTV.video.style.display = 'none'; }

  ltvResetQuality();
  var svw = ltvEl('ltvServers'); if(svw) svw.innerHTML = '';

  var mini = ltvEl('ltvMini'); if(mini) mini.hidden = true;

}
function ltvDock(){
  if(!LTV.id || LTV.inPip) return;
  var mini = ltvEl('ltvMini'); if(!mini) return;
  if(LTV.mode === 'native' && LTV.video){
    var slot = ltvEl('ltvMiniSlot');
    if(LTV.video.parentNode !== slot) slot.appendChild(LTV.video);
    mini.classList.remove('infoonly');
    var dn = ltvEl('ltvDockNote'); if(dn) dn.hidden = false;
  } else {
    mini.classList.add('infoonly');
    var ms = ltvEl('ltvMiniState'); if(ms) ms.textContent = 'Playing on the TV page (embedded player)';
  }

  LTV.docked = true;
}
function ltvUndock(){
  var mini = ltvEl('ltvMini'); if(mini) mini.hidden = true;
  if(LTV.inPip) return;
  var dn = ltvEl('ltvDockNote'); if(dn) dn.hidden = true;
  if(LTV.mode === 'native' && LTV.video){
    var slot = ltvEl('ltvMediaSlot');
    if(slot && LTV.video.parentNode !== slot) slot.appendChild(LTV.video);
  }
  LTV.docked = false;
}
function ltvSyncDock(){
  if(!LTV.id) return;
  var tvEl = ltvEl('view-tv');
  var onTv = !!(tvEl && tvEl.classList.contains('on'));
  if(!onTv){ ltvDock(); return; }
  var stage = ltvEl('ltvStage');
  if(stage && stage.hidden){ ltvDock(); return; }
  ltvUndock();
}
function ltvOnView(name){
  if(name === 'watch'){ if(LTV.id) ltvStopPlayer(); return; }
  if(!LTV.id) return;
  if(name === 'tv'){ ltvUndock(); } else { ltvDock(); }
}
function ltvSilence(){
  if(!LTV.id) return;
  if(LTV.mode === 'native' && LTV.video){
    try{ LTV.video.pause(); }catch(e){}

  } else if(LTV.mode === 'frame'){
    var id = LTV.id;
    ltvClearFrame();
    ltvShowOverlay('<div><div lang="en">Stopped — another player started.</div><div class="ltv-ov-btns"><button type="button" class="ltv-btn" id="ltvResumeBtn">▶ Play this channel again</button></div></div>');
    var rb = ltvEl('ltvResumeBtn'); if(rb) rb.addEventListener('click', function(){ ltvPlay(id); });
  }
}
function ltvUpdatePipBtn(){
  var b = ltvEl('ltvPipBtn'); if(!b) return;
  var ok = LTV.mode === 'native' && !!document.pictureInPictureEnabled && LTV.video && typeof LTV.video.requestPictureInPicture === 'function';
  b.disabled = !ok;
  b.title = ok ? 'Play in a floating window (browser Picture-in-Picture)' : (LTV.mode === 'frame' ? 'Picture-in-Picture is not available for embedded players' : 'Picture-in-Picture is not supported by this browser');
}
(function ltvInit(){
  var grid = ltvEl('tvGrid');
  if(grid){
    grid.addEventListener('click', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      if(t.closest('.favbtn')) return;
      var card = t.closest('.lnt-card');
      if(!card) return;
      var href = card.getAttribute('data-href') || '';
      var id = href.replace('#watch/', '');
      if(!id) return;
      var ch = findTv(id);
      if(!ch) return;
      if(getChannelSources(ch).length){ e.preventDefault(); e.stopPropagation(); ltvPlay(id); }
    }, true);
  }
  var pipBtn = ltvEl('ltvPipBtn');
  if(pipBtn) pipBtn.addEventListener('click', function(){
    var v = LTV.video;
    if(!v) return;
    if(document.pictureInPictureElement){ document.exitPictureInPicture().catch(function(){}); return; }
    if(v.requestPictureInPicture){ v.requestPictureInPicture().catch(function(){ ltvSetSub('Picture-in-Picture was blocked for this stream/browser'); }); }
  });
  var pageBtn = ltvEl('ltvPageBtn');
  if(pageBtn) pageBtn.addEventListener('click', function(){ if(LTV.id) location.hash = '#watch/' + LTV.id; });
  var stopBtn = ltvEl('ltvStopBtn');
  if(stopBtn) stopBtn.addEventListener('click', function(){ ltvStopPlayer(); });
  var qSel = ltvEl('ltvQuality');
  if(qSel) qSel.addEventListener('change', function(){

    LTV.q = isNaN(v) ? -1 : v;
    if(LTV.hls){ try{ LTV.hls.currentLevel = LTV.q; }catch(e){} }
  });
  var mo = ltvEl('ltvMiniOpen');
  if(mo) mo.addEventListener('click', function(){ location.hash = '#tv'; });
  var mc = ltvEl('ltvMiniClose');
  if(mc) mc.addEventListener('click', function(){ ltvStopPlayer(); });
  window.addEventListener('hashchange', function(){ setTimeout(ltvSyncDock, 60); });
  if(typeof showView === 'function' && !showView._ltvHooked){
    var origShowView = showView;
    showView = window.showView = function(name, param){
      var r = origShowView.apply(this, arguments);
      try{ ltvOnView(name); }catch(e){}
      return r;
    };
    showView._ltvHooked = true;
  }
  if(typeof stopOthers === 'function' && !stopOthers._ltvHooked){
    var origStopOthers = stopOthers;
    stopOthers = window.stopOthers = function(keep){
      if(keep !== 'tv'){ try{ ltvSilence(); }catch(e){} }
      return origStopOthers.apply(this, arguments);
    };
    stopOthers._ltvHooked = true;
  }
  if('IntersectionObserver' in window){
    var stage = ltvEl('ltvStage');

        if(!LTV.id || LTV.inPip) return;
        var tvEl = ltvEl('view-tv');
        if(!tvEl || !tvEl.classList.contains('on')) return;
        if(entries[0].isIntersecting){ ltvUndock(); } else { ltvDock(); }
      }, { threshold: 0.05 });
      io.observe(stage);
    }
  }
  ltvUpdatePipBtn();
})();
</script>
<script>
(function ltvHeadInit(){

      return r;
    };
    showView._ltvHeadHooked = true;
  }

<script>
/* ===== Chandio TV boot: render, search wiring, deep links ===== */
(function boot(){
  function route(){
    var h = location.hash || '';
    if(h.indexOf('#watch/') === 0){
      var id = h.slice('#watch/'.length);
      if(id && typeof ltvPlay === 'function' && typeof LTV !== 'undefined' && LTV.id !== id) ltvPlay(id);
    } else if(h === '#tv'){
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
  window.addEventListener('hashchange', route);
  renderTv();
  route();
  var si = document.getElementById('tvSearchUni');
  if(si) si.addEventListener('input', function(){ renderTv(); });
  var mb = document.getElementById('ltvMenuBtn');
  if(mb) mb.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
</script>
</body>
</html>
