var v=document.getElementById('v'), idx=-1, hls=null, timer=null, running=false, okC=0, badC=0, decided=false;
var el=function(id){return document.getElementById(id)};
function cleanup(){ if(timer){clearTimeout(timer);timer=null;} if(hls){try{hls.destroy()}catch(e){} hls=null;} }
function mark(ok){
  if(decided) return; decided=true;
  var ch=CH[idx];
  var d=document.createElement('div'); d.textContent=(idx+1)+'. '+ch.name;
  if(ok){ okC++; el('okList').prepend(d); el('okN').textContent=okC; el('status').textContent='✅ چل گیا: '+ch.name; el('status').style.color='#66bb6a'; }
  else { badC++; el('badList').prepend(d); el('badN').textContent=badC; el('status').textContent='❌ نہیں چلا: '+ch.name; el('status').style.color='#ef5350'; }
}
function next(){ if(!running) return; idx++; if(idx>=CH.length){ el('status').textContent='🎉 ٹیسٹ مکمل — '+CH.length+' چینلز'; running=false; cleanup(); return; } play(); }
function play(){
  cleanup(); decided=false;
  var ch=CH[idx];
  el('count').textContent=(idx+1)+' / '+CH.length;
  el('name').textContent=ch.name;
  el('meta').textContent=(ch.country||'')+' — '+ch.host;
  el('status').textContent='⏳ لوڈ ہو رہا ہے…'; el('status').style.color='#ffd54f';
  var url=ch.url;
  timer=setTimeout(function(){ mark(false); setTimeout(next,400); }, 10000);
  if(window.Hls && Hls.isSupported() && url.indexOf('.m3u8')>-1){
    hls=new Hls({maxBufferLength:10});
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,function(e,data){ if(data && data.fatal){ mark(false); setTimeout(next,400); } });
  } else { v.src=url; }
  var p=v.play(); if(p&&p.catch) p.catch(function(){});
}
v.addEventListener('playing',function(){ if(!running) return; mark(true); if(timer)clearTimeout(timer); timer=setTimeout(next,6000); });
v.addEventListener('error',function(){ if(!running||decided) return; mark(false); setTimeout(next,400); },true);
el('startBtn').addEventListener('click',function(){
  if(running){ return; }
  running=true; el('startBtn').textContent='▶ چل رہا ہے…';
  if(idx<0) idx=0; play();
});
el('skipBtn').addEventListener('click',function(){ if(!running)return; mark(false); setTimeout(next,200); });

  if(running){ running=false; cleanup(); try{v.pause()}catch(e){} el('pauseBtn').textContent='جاری ▶'; el('startBtn').textContent='▶ شروع کریں'; }

});
