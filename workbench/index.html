<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raheem AI Workbench</title>
<meta http-equiv="refresh" content="1;url=https://api.trycloudflare.com">
<style>
  body{margin:0;min-height:100vh;background:#06132D;color:#D9E8FF;
       font-family:system-ui,'Segoe UI',Tahoma,sans-serif;
       display:flex;align-items:center;justify-content:center}
  .card{background:rgba(9,45,105,.55);border:1px solid rgba(245,184,0,.45);
        border-radius:20px;padding:28px 22px;max-width:340px;width:88%;
        text-align:center;box-shadow:0 0 24px rgba(0,207,255,.15)}
  h1{color:#FFD45A;font-size:20px;margin:0 0 8px}
  p{font-size:15px;line-height:1.8;margin:6px 0 18px}
  a.btn{display:inline-block;background:linear-gradient(180deg,#FFD45A,#F5B800);
        color:#06132D;font-weight:700;text-decoration:none;
        padding:12px 26px;border-radius:999px;font-size:15px}
  .small{font-size:12px;color:#8FB6E8;margin-top:14px}
</style>
<script>location.replace("https://api.trycloudflare.com");</script>
</head>
<body>
  <div class="card">
    <h1>Raheem AI Workbench</h1>
    <p>Workbench کھل رہا ہے…</p>
    <a class="btn" href="https://api.trycloudflare.com">Workbench کھولیں</a>
    <div class="small">خود بخود نہ کھلے تو بٹن دبائیں</div>
  </div>
</body>
</html>
