<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raheem AI Workbench</title>
<style>
  body{margin:0;min-height:100vh;background:#06132D;color:#D9E8FF;
       font-family:system-ui,'Segoe UI',Tahoma,sans-serif;
       display:flex;align-items:center;justify-content:center}
  .card{background:rgba(9,45,105,.55);border:1px solid rgba(245,184,0,.45);
        border-radius:20px;padding:28px 22px;max-width:340px;width:88%;
        text-align:center;box-shadow:0 0 24px rgba(0,207,255,.15)}
  h1{color:#FFD45A;font-size:20px;margin:0 0 8px}
  p{font-size:15px;line-height:1.9;margin:6px 0}
  .small{font-size:12.5px;color:#8FB6E8;margin-top:12px;line-height:1.8}
</style>
</head>
<body>
  <div class="card">
    <h1>Raheem AI Workbench</h1>
    <p>متبادل راستہ ابھی تیار ہو رہا ہے۔</p>
    <p>یہ دروازہ خود بخود نئے پتے پر لے جائے گا جب راستہ کھل جائے گا۔</p>
    <div class="small">اس دوران اصل ریلے والا راستہ استعمال کریں۔</div>
  </div>
</body>
</html>
